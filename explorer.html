<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>City Quest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --ink:#1f2a44; --paper:#fffdf6; --accent:#ffb703; --good:#2a9d4a; --bad:#d64545; --blue:#3a6ea5; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color:var(--ink); }
    #map { height:100vh; background:#8fb78f; }
    button { font-family:inherit; cursor:pointer; }

    /* ---------- top bar ---------- */
    #bar { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:1000; display:flex; gap:6px; align-items:center;
           background:var(--paper); border:3px solid var(--ink); border-radius:40px; padding:6px 8px; box-shadow:0 4px 0 rgba(0,0,0,.25); max-width:96vw; flex-wrap:wrap; justify-content:center; }
    #bar button { border:2px solid transparent; background:transparent; border-radius:30px; font-size:15px; font-weight:bold; padding:8px 12px; color:var(--ink); }
    #bar button:hover { background:#ffe9a8; }
    #bar button.on { background:var(--accent); border-color:var(--ink); }
    #passport { font-size:14px; font-weight:bold; padding:0 8px; white-space:nowrap; }
    #passport .stamp { filter:grayscale(1); opacity:.35; transition:.3s; }
    #passport .stamp.got { filter:none; opacity:1; }

    /* ---------- map pins ---------- */
    .pin { width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; background:var(--c); border:4px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,.5);
           display:flex; align-items:center; justify-content:center; font-size:24px; transition:transform .15s; }
    .pin:hover, .pin.visited:hover { transform:scale(1.2); }
    .pin.visited::after { content:"✓"; position:absolute; right:-6px; top:-6px; background:var(--good); color:#fff; font-size:13px; font-weight:bold; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid #fff; }
    .quiz .pin.visited::after { display:none; }
    .quiz .leaflet-tooltip { display:none; }
    .leaflet-tooltip.lbl { font-weight:bold; font-size:13px; border:2px solid var(--ink); border-radius:10px; background:var(--paper); color:var(--ink); }
    .ring { width:90px; height:90px; margin:-45px 0 0 -45px; border-radius:50%; border:5px solid var(--accent); animation:pulse 1s ease-out infinite; pointer-events:none; }
    @keyframes pulse { from { transform:scale(.5); opacity:1; } to { transform:scale(1.5); opacity:0; } }
    .shake { animation:shake .35s; }
    @keyframes shake { 25% { transform:translateX(-8px);} 75% { transform:translateX(8px);} }

    /* ---------- info card ---------- */
    #card { position:fixed; z-index:1000; top:70px; left:10px; width:340px; max-height:calc(100vh - 90px); overflow:auto; background:var(--paper);
            border:3px solid var(--ink); border-radius:18px; padding:16px; box-shadow:0 6px 0 rgba(0,0,0,.25); display:none; }
    #card h2 { margin:0 0 4px; font-size:22px; }
    #card .tag { display:inline-block; font-size:12px; font-weight:bold; padding:3px 10px; border-radius:20px; background:var(--c,#999); color:#fff; margin-bottom:8px; }
    #card h4 { margin:12px 0 3px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--blue); }
    #card p { margin:0; line-height:1.4; font-size:15px; }
    .chips span { display:inline-block; background:#e8f1fb; border-radius:14px; padding:3px 10px; margin:2px 3px 2px 0; font-size:13px; }
    .row { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
    .btn { border:3px solid var(--ink); background:var(--accent); border-radius:12px; padding:8px 14px; font-size:15px; font-weight:bold; color:var(--ink); box-shadow:0 3px 0 rgba(0,0,0,.25); }
    .btn:active { transform:translateY(2px); box-shadow:none; }
    .btn.alt { background:#fff; }
    .btn.good { background:#b7efc5; } .btn.bad { background:#ffc9c9; }
    .x { position:absolute; top:8px; right:10px; background:none; border:none; font-size:22px; }

    /* ---------- HUD (play) ---------- */
    #hud { position:fixed; z-index:1000; bottom:16px; left:50%; transform:translateX(-50%); width:min(560px, 94vw); background:var(--paper); border:3px solid var(--ink);
           border-radius:18px; padding:14px 16px; box-shadow:0 6px 0 rgba(0,0,0,.25); display:none; }
    #hud .top { display:flex; justify-content:space-between; font-weight:bold; font-size:14px; color:var(--blue); }
    #hud .q { font-size:18px; margin:8px 0; line-height:1.35; }
    #hud .fb { min-height:22px; font-weight:bold; line-height:1.35; }
    .prog { height:8px; background:#ddd; border-radius:6px; overflow:hidden; margin-top:4px; }
    .prog i { display:block; height:100%; background:var(--good); transition:width .3s; }

    /* ---------- modal ---------- */
    #modal { position:fixed; inset:0; z-index:2000; background:rgba(20,30,50,.6); display:none; align-items:center; justify-content:center; padding:12px; }
    #modal .box { background:var(--paper); border:4px solid var(--ink); border-radius:22px; padding:22px; width:min(720px, 100%); max-height:94vh; overflow:auto; position:relative; }
    #modal h2 { margin-top:0; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:8px; margin:12px 0; }
    .grid .btn { font-size:14px; padding:10px 6px; }
    .scen { font-size:20px; line-height:1.35; margin:10px 0; }
    .meter { margin:10px 0; }
    .meter .lbl { display:flex; justify-content:space-between; font-weight:bold; font-size:14px; }
    .meter .bar { height:16px; background:#ddd; border-radius:10px; overflow:hidden; border:2px solid var(--ink); }
    .meter .bar i { display:block; height:100%; transition:width .3s; }
    .meter input { width:100%; }
    .big { font-size:48px; text-align:center; }
    .help { font-size:13px; color:#566; }

    /* ---------- tree ---------- */
    .tree, .tree ul { list-style:none; margin:0; padding-left:22px; border-left:3px dashed #9ab; }
    .tree { border:none; padding:0; }
    .tree li { margin:8px 0; }
    .node { display:inline-block; background:#fff; border:3px solid var(--ink); border-radius:12px; padding:6px 12px; font-weight:bold; font-size:14px; }
    .node small { display:block; font-weight:normal; color:#455; }
    .node.link { cursor:pointer; background:#fff3c4; }
    .loop { display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:center; margin:12px 0; font-weight:bold; font-size:14px; }
    .loop span.b { background:#e8f1fb; border:2px solid var(--ink); border-radius:12px; padding:6px 10px; }

    #toast { position:fixed; z-index:3000; top:70px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:30px; font-weight:bold; display:none; max-width:90vw; text-align:center; }

    @media (max-width:640px) {
      #card { top:auto; bottom:0; left:0; right:0; width:auto; max-height:55vh; border-radius:18px 18px 0 0; }
      #hud { bottom:6px; }
      #bar button { padding:6px 8px; font-size:13px; }
    }
  </style>
</head>

    { t:"🗳️ It's election day! Where do grown-ups go to cast their vote?", a:"voting", why:"Voters use a voting center to choose leaders in private." },
    { t:"🐕 You found a lost puppy with no owner nearby.", a:"shelter", why:"The animal shelter cares for lost pets and helps find their families." },
    { t:"🚗 Your older sister is 16 and wants a driver's license.", a:"dmv", why:"The DMV (a state service) tests drivers and gives out licenses." },
    { t:"🏫 It's Monday morning and kids need to learn math and reading.", a:"school", why:"Public schools teach kids, and are paid for by taxes." },
    { t:"💉 It's time for a flu shot clinic for the neighborhood.", a:"hospital", why:"Hospitals and public clinics give vaccines to keep the community healthy." },
    { t:"♻️ Your class collected a mountain of cans and paper to recycle.", a:"garbage", why:"The recycling depot sorts materials so they can be made into new things." }
  ];

  SCENARIOS = SCENARIOS.filter(function (x) { return byId[x.a]; });
  var SERVICE_ORDER = ["police","hospital","fire","garbage","hall"];
  var BUDGET_EVENTS = [
    { t:"❄️ Flu season hits the city!", need:{ hospital:+15 } },
    { t:"🌳 A dry summer makes wildfires more likely.", need:{ fire:+15 } },
    { t:"🎪 A huge street festival is coming, with lots of visitors.", need:{ police:+10, garbage:+10 } },
    { t:"🏗️ The city is growing and needs more permits and planning.", need:{ hall:+15 } },
    { t:"🌧️ A big storm leaves branches and trash everywhere.", need:{ garbage:+15 } }
  ];
  var BASE_NEED = { police:20, hospital:25, fire:15, garbage:15, hall:25 };

  var TREE = {
    top: { name:"Residents (that's you and your neighbors!)", sub:"Vote, pay taxes, and share ideas" },
    elected: [
      { name:"Mayor", sub:"Leads the city and makes sure laws are followed", id:"hall" },
      { name:"City Council", sub:"Votes on rules and decides the budget", id:"hall" }
    ],
    depts: [
      { name:"Police Department", sub:"Safety and law", id:"police" },
      { name:"Fire Department", sub:"Fires and rescues", id:"fire" },
      { name:"Public Health", sub:"Hospitals and clinics", id:"hospital" },
      { name:"Sanitation Department", sub:"Trash and recycling", id:"garbage" },
      { name:"City Clerk", sub:"Records, permits, licenses", id:"hall" }
    ]
  };

  /* =====================================================================
     STATE + SAVED PROGRESS
     ===================================================================== */
  var save = { visited:{}, best:{ find:0, mayor:0, budget:0 } };
  try { var s = JSON.parse(localStorage.getItem("cityapp2")); if (s) save = Object.assign(save, s); } catch (e) {}
  function persist() { try { localStorage.setItem("cityapp2", JSON.stringify(save)); } catch (e) {} }

  var mode = "explore";
  var $ = function (id) { return document.getElementById(id); };
  function shuffle(a) { return a.slice().sort(function () { return Math.random() - 0.5; }); }
  function stars(n) { return "⭐".repeat(n) + "☆".repeat(3 - n); }

  /* =====================================================================
     MAP
     ===================================================================== */
  var bounds = [[0, 0], [H, W]];
  var WORLD = [[-200, -200], [H + 200, W + 200]];
  var map = L.map("map", { crs: L.CRS.Simple, minZoom: -1, maxZoom: 2, zoomDelta: 0.5, zoomSnap: 0.5, wheelPxPerZoomLevel: 120, zoomControl: true, maxBounds: WORLD, maxBoundsViscosity: 1.0 });

  L.imageOverlay("city-map-v2.webp", bounds).addTo(map);
  map.fitBounds(bounds);
  function goHome() { map.flyToBounds(bounds, { duration: 0.8 }); }

  var markers = {};
  BUILDINGS.forEach(function (b) {
    var icon = L.divIcon({ className:"", html:'<div class="pin" id="pin-' + b.id + '" style="--c:' + b.color + '">' + b.emoji + "</div>", iconSize:[0,0] });
    var m = L.marker(P(b.top, b.x), { icon: icon, keyboard: true, title: b.name }).addTo(map);
    m.bindTooltip(b.name, { direction:"bottom", permanent:true, offset:[0, 24], className:"lbl" });
    m.on("click", function () { onPin(b.id); });
    markers[b.id] = m;
  });
  refreshPins();

  function refreshPins() {
    BUILDINGS.forEach(function (b) {
      var el = $("pin-" + b.id);
      if (el) el.classList.toggle("visited", !!save.visited[b.id]);
    });
    var got = BUILDINGS.filter(function (b) { return save.visited[b.id]; });
    $("passport").innerHTML = "🎟️ Stamps: " + got.length + "/" + BUILDINGS.length + (got.length === BUILDINGS.length ? " 🏆" : "");
  }

  var ringMarker = null;
  function pulse(id) {
    clearRing();
    var b = byId[id];
    ringMarker = L.marker(P(b.top, b.x), { icon: L.divIcon({ className:"", html:'<div class="ring"></div>', iconSize:[0,0] }), interactive:false }).addTo(map);
  }
  function clearRing() { if (ringMarker) { map.removeLayer(ringMarker); ringMarker = null; } }
  function flyTo(id) { var b = byId[id]; map.flyTo(P(b.top, b.x), 0.5, { duration:0.8 }); }

  function toast(msg, ms) {
    var t = $("toast"); t.textContent = msg; t.style.display = "block";

  }

  /* =====================================================================
     MODES
     ===================================================================== */
  function setMode(m) {
    mode = m;
    ["explore","play","mayor","budget","dir","tree"].forEach(function (k) { $("m-" + k).classList.toggle("on", k === m); });
    document.body.classList.toggle("quiz", m === "play");
    $("hud").style.display = "none";
    closeModal(); clearRing(); window.speechSynthesis && speechSynthesis.cancel();

    if (m === "explore") goHome();
  }

  function onPin(id) {

    if (mode === "explore") showCard(id);
  }

  /* ---------- EXPLORE ---------- */
  function showCard(id) {
    var b = byId[id], c = $("card");
    flyTo(id);
    var first = !save.visited[id];
    save.visited[id] = true; persist(); refreshPins();
    c.style.setProperty("--c", b.color);
    c.innerHTML =
      '<button class="x" onclick="closeCard()" aria-label="close">✕</button>' +
      '<span class="tag">' + b.level + ' service</span><h2>' + b.emoji + " " + b.name + "</h2>" +
      "<p>" + b.what + "</p>" +
      "<h4>Inside you'd see</h4><p>" + b.inside + "</p>" +
      '<h4>Who works here</h4><div class="chips">' + b.workers.map(function (w) { return "<span>" + w + "</span>"; }).join("") + "</div>" +
      "<h4>Who pays for it?</h4><p>" + b.funded + "</p>" +
      "<h4>How it helps you</h4><p>" + b.helps + "</p>" +
      "<h4>Fun fact</h4><p>💡 " + b.fact + "</p>" +
      '<div class="row"><button class="btn alt" onclick="readAloud(\'' + id + '\')">🔊 Read to me</button>' +
      (id === "hall" ? '<button class="btn" onclick="showTree()">🌳 Family tree</button>' : "") + "</div>";
    c.style.display = "block"; c.scrollTop = 0;
    if (first) {
      var n = Object.keys(save.visited).length;
      toast(n === BUILDINGS.length ? "🎉 You visited every building! You're a City Explorer!" : "New stamp: " + b.emoji + " (" + n + "/" + BUILDINGS.length + ")");
    }
  }
  function closeCard() { $("card").style.display = "none"; }
  function readAloud(id) {
    if (!window.speechSynthesis) return toast("Reading aloud isn't supported on this device.");
    var b = byId[id]; speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(b.name + ". " + b.what + " Inside you'd see: " + b.inside + " " + b.helps));
  }

  /* ---------- FIND IT (map quiz) ---------- */
  var PL = null;
  function startPlay() {
    setMode("play");
    var pool = [];
    BUILDINGS.forEach(function (b) {
      pool.push({ type:"find", text:b.clue, a:b.id, fact:b.fact });
      pool.push({ type:"find", text:b.who, a:b.id, fact:b.fact });
    });
    HOMES.forEach(function (h) { pool.push({ type:"gov", id:h.id, gov:false, fact:h.fact }); });
    pool.push({ type:"gov", id:"post", gov:true, fact:"The post office is a government service too, but run by the national government." });
    pool.push({ type:"gov", id:"library", gov:true, fact:"Libraries are paid for by taxes, so they are government services." });
    pool.push({ type:"gov", id:"dmv", gov:true, fact:"The DMV is a government office, run by the state." });
    pool = pool.filter(function (q) { return q.type === "find" ? byId[q.a] : byId[q.id]; });
    PL = { qs: shuffle(shuffle(pool).filter(function (q) { return q.type === "gov"; }).slice(0, 3).concat(shuffle(pool.filter(function (q) { return q.type === "find"; })).slice(0, 7))).slice(0, 10), i:0, score:0, streak:0, tries:0, correct:0, locked:false };
    goHome();
    playAsk();
  }
  function playAsk() {
    clearRing();
    var q = PL.qs[PL.i]; PL.tries = 0; PL.locked = false;
    var body = q.type === "find"
      ? '<div class="q">📍 ' + q.text + '</div><div class="help">Tap the building on the map.</div>'
      : '<div class="q">👀 Look at the glowing ' + byId[q.id].emoji + ". Is it a government building?</div>" +
        '<div class="row"><button class="btn good" onclick="playGov(true)">🏛️ Government</button><button class="btn bad" onclick="playGov(false)">🏠 Not government</button></div>';
    if (q.type === "gov") { flyTo(q.id); pulse(q.id); }
    $("hud").innerHTML =
      '<div class="top"><span>Question ' + (PL.i + 1) + "/" + PL.qs.length + "</span><span>⭐ " + PL.score + (PL.streak > 1 ? " 🔥×" + PL.streak : "") + "</span></div>" +
      '<div class="prog"><i style="width:' + (PL.i / PL.qs.length * 100) + '%"></i></div>' + body +
      '<div class="fb" id="fb"></div><div class="row" id="hud-actions">' +
      (q.type === "find" ? '<button class="btn alt" onclick="playHint()">💡 Hint (−25)</button>' : "") +
      '<button class="btn alt" onclick="setMode(\'explore\')">✖ Exit</button></div>';
    $("hud").style.display = "block";
  }
  function playHint() {
    var q = PL.qs[PL.i]; if (PL.locked) return;
    PL.score = Math.max(0, PL.score - 25); PL.hinted = true;
    pulse(q.a); setTimeout(clearRing, 2500);
    $("fb").textContent = "The glow shows the area. Look closely!";
  }
  function playTap(id) {
    if (!PL || PL.locked || PL.qs[PL.i].type !== "find") return;
    var q = PL.qs[PL.i];
    if (id === q.a) return playRight(q, byId[id].name);
    playWrong(q, "That's the " + byId[id].name + ".", q.a);
  }
  function playGov(ans) {
    if (PL.locked) return;
    var q = PL.qs[PL.i];
    if (ans === q.gov) playRight(q, "Yes!"); else playWrong(q, "Not quite.", null);
  }
  function playRight(q, msg) {
    var pts = 100 + Math.min(PL.streak, 4) * 25 - (PL.tries ? 50 : 0);
    PL.score += pts; PL.streak++; PL.correct++; PL.locked = true;
    $("fb").style.color = "var(--good)";
    $("fb").innerHTML = "✅ " + msg + " +" + pts + "<br><span style='font-weight:normal;color:var(--ink)'>💡 " + q.fact + "</span>";
    nextButton();
  }
  function playWrong(q, msg, revealId) {
    PL.tries++; PL.streak = 0;
    var fb = $("fb"); fb.style.color = "var(--bad)"; $("hud").classList.add("shake");
    setTimeout(function () { $("hud").classList.remove("shake"); }, 400);
    if (PL.tries >= 2) {
      PL.locked = true; var ans = q.type === "find" ? byId[q.a].name : (q.gov ? "government" : "not government");
      if (revealId) { flyTo(revealId); pulse(revealId); }
      fb.innerHTML = "❌ " + msg + " The answer was <b>" + ans + "</b>.<br><span style='font-weight:normal;color:var(--ink)'>💡 " + q.fact + "</span>";
      nextButton();
    } else fb.textContent = "❌ " + msg + " Try once more!";
  }
  function nextButton() {
    var last = PL.i === PL.qs.length - 1;
    $("hud-actions").insertAdjacentHTML("afterbegin", '<button class="btn" onclick="playNext()">' + (last ? "See results 🏁" : "Next ➜") + "</button>");
  }
  function playNext() { PL.i++; if (PL.i >= PL.qs.length) playEnd(); else playAsk(); }
  function playEnd() {
    clearRing(); $("hud").style.display = "none";
    var pct = PL.correct / PL.qs.length, n = pct >= 0.9 ? 3 : pct >= 0.6 ? 2 : 1;
    var best = save.best.find < PL.score; if (best) { save.best.find = PL.score; persist(); }
    openModal('<div class="big">' + stars(n) + "</div><h2 style='text-align:center'>" + PL.correct + "/" + PL.qs.length + " correct · " + PL.score + " points</h2>" +
      "<p style='text-align:center'>" + (best ? "🏆 New personal best!" : "Best score: " + save.best.find) + "</p>" +
      '<div class="row" style="justify-content:center"><button class="btn" onclick="startPlay()">Play again</button><button class="btn alt" onclick="setMode(\'explore\')">Back to map</button></div>');
  }

  /* ---------- MAYOR DAY ---------- */
  var MY = null;
  function startMayor() {
    setMode("mayor");
    MY = { qs: shuffle(SCENARIOS).slice(0, 6).map(function (x) { return Object.assign({}, x); }), i:0, score:0, tries:0, fb:"", done:false };
    mayorRender();
  }
  function mayorRender() {
    var q = MY.qs[MY.i];
    q.opts = q.opts || shuffle([q.a].concat(shuffle(BUILDINGS.filter(function (x) { return x.id !== q.a; })).slice(0, 5).map(function (x) { return x.id; })));
    var btns = q.opts.map(function (id) { return byId[id]; }).map(function (b) {
      return '<button class="btn alt" ' + (MY.done ? "disabled" : "") + ' onclick="mayorPick(\'' + b.id + '\')">' + b.emoji + "<br>" + b.name + "</button>";
    }).join("");
    openModal("<h2>🎩 Mayor Day <span class='help'>(" + (MY.i + 1) + "/" + MY.qs.length + " · ⭐ " + MY.score + ")</span></h2>" +
      "<p class='help'>Citizens are calling your office. Which city service should help?</p>" +
      "<div class='scen'>" + q.t + "</div><div class='grid'>" + btns + "</div>" +
      "<div id='my-fb' style='font-weight:bold;min-height:44px'>" + MY.fb + "</div>" +
      '<div class="row">' + (MY.done ? '<button class="btn" onclick="mayorNext()">' + (MY.i === MY.qs.length - 1 ? "Finish 🏁" : "Next call ➜") + "</button>" : "") +
      '<button class="btn alt" onclick="setMode(\'explore\')">✖ Exit</button></div>');
  }
  function mayorPick(id) {
    var q = MY.qs[MY.i];
    if (id === q.a) {
      var pts = MY.tries ? 50 : 100; MY.score += pts; MY.done = true;
      MY.fb = '<span style="color:var(--good)">✅ Yes! +' + pts + "</span> " + q.why;
    } else {
      MY.tries++;
      if (MY.tries >= 2) { MY.done = true; MY.fb = '<span style="color:var(--bad)">The right answer was ' + byId[q.a].emoji + " " + byId[q.a].name + ".</span> " + q.why; }
      else MY.fb = '<span style="color:var(--bad)">❌ Not the ' + byId[id].name + ". Think about what they do, then try again.</span>";
    }
    mayorRender();
  }
  function mayorNext() {
    MY.i++; MY.tries = 0; MY.done = false; MY.fb = "";
    if (MY.i >= MY.qs.length) {
      var n = MY.score >= 500 ? 3 : MY.score >= 300 ? 2 : 1, best = save.best.mayor < MY.score;
      if (best) { save.best.mayor = MY.score; persist(); }
      openModal('<div class="big">' + stars(n) + "</div><h2 style='text-align:center'>Mayor Day complete! " + MY.score + " points</h2><p style='text-align:center'>" +
        (best ? "🏆 New personal best!" : "Best: " + save.best.mayor) + "</p>" +
        '<div class="row" style="justify-content:center"><button class="btn" onclick="startMayor()">Another day</button><button class="btn alt" onclick="setMode(\'explore\')">Back to map</button></div>');
    } else mayorRender();
  }

  /* ---------- BUDGET ---------- */
  var BG = null;
  function startBudget() {
    setMode("budget");
    BG = { round:0, events: shuffle(BUDGET_EVENTS).slice(0, 3), alloc:{}, total:0, results:[] };
    budgetRound();
  }
  function budgetNeeds() {
    var need = Object.assign({}, BASE_NEED), ev = BG.events[BG.round];
    Object.keys(ev.need).forEach(function (k) { need[k] += ev.need[k]; });
    return need;
  }
  function budgetRound() {
    BG.alloc = {}; SERVICE_ORDER.forEach(function (k) { BG.alloc[k] = 0; });
    var ev = BG.events[BG.round];
    var rows = SERVICE_ORDER.map(function (k) {
      return '<div class="meter"><div class="lbl"><span>' + byId[k].emoji + " " + byId[k].name + '</span><span id="v-' + k + '">0 coins</span></div>' +
        '<input type="range" min="0" max="40" value="0" aria-label="' + byId[k].name + ' coins" oninput="budgetSet(\'' + k + '\', +this.value)">' +
        '<div class="bar"><i id="b-' + k + '" style="width:0;background:var(--bad)"></i></div></div>';
    }).join("");
    openModal("<h2>💰 City Budget — Year " + (BG.round + 1) + "/3</h2>" +
      "<p><b>" + ev.t + "</b></p>" +
      "<p class='help'>The city collected <b>100 coins</b> in taxes. Share them between services. The bars show how well each need is met — spend all 100 to continue. Some services need more this year!</p>" +
      rows + '<p><b id="left">100 coins left</b></p><div id="bg-fb" class="help"></div>' +
      '<div class="row"><button class="btn" id="bg-go" disabled onclick="budgetDone()">Approve budget ✅</button><button class="btn alt" onclick="setMode(\'explore\')">✖ Exit</button></div>');
  }
  function budgetSet(k, v) {
    var others = SERVICE_ORDER.reduce(function (s, x) { return s + (x === k ? 0 : BG.alloc[x]); }, 0);
    v = Math.min(v, 100 - others); BG.alloc[k] = v;
    var need = budgetNeeds();
    SERVICE_ORDER.forEach(function (s) {
      var pct = Math.min(1, BG.alloc[s] / need[s]);
      $("v-" + s).textContent = BG.alloc[s] + " coins (needs " + need[s] + ")";
      var bar = $("b-" + s); bar.style.width = pct * 100 + "%";
      bar.style.background = pct >= 0.9 ? "var(--good)" : pct >= 0.6 ? "var(--accent)" : "var(--bad)";
    });
    document.querySelectorAll("#modal-box input[type=range]").forEach(function (el, i) { el.value = BG.alloc[SERVICE_ORDER[i]]; });
    var left = 100 - others - v; $("left").textContent = left + " coins left"; $("bg-go").disabled = left !== 0;
  }
  function budgetDone() {
    var need = budgetNeeds(), tot = 0, worst = null, worstPct = 2;
    SERVICE_ORDER.forEach(function (s) {
      var p = Math.min(1, BG.alloc[s] / need[s]); tot += p;
      if (p < worstPct) { worstPct = p; worst = s; }
    });
    var happy = Math.round(tot / SERVICE_ORDER.length * 100);
    BG.results.push(happy);
    var msg = worstPct >= 1 ? "Every need was met. Great planning!" :
      "The biggest gap: " + byId[worst].emoji + " " + byId[worst].name + " got only " + Math.round(worstPct * 100) + "% of what it needed.";
    var last = BG.round === 2;
    openModal("<h2>Year " + (BG.round + 1) + " results</h2><div class='big'>" + (happy >= 90 ? "😄" : happy >= 70 ? "🙂" : "😟") + "</div>" +
      "<h2 style='text-align:center'>City happiness: " + happy + "%</h2><p style='text-align:center'>" + msg + "</p>" +
      "<p class='help' style='text-align:center'>Real city leaders face this every year: there is never enough money for everything, so they listen to residents and make choices.</p>" +
      '<div class="row" style="justify-content:center"><button class="btn" onclick="' + (last ? "budgetEnd()" : "BG.round++;budgetRound()") + '">' + (last ? "Final score 🏁" : "Next year ➜") + "</button></div>");
  }
  function budgetEnd() {
    var avg = Math.round(BG.results.reduce(function (a, b) { return a + b; }, 0) / BG.results.length);
    var n = avg >= 90 ? 3 : avg >= 75 ? 2 : 1, best = save.best.budget < avg;
    if (best) { save.best.budget = avg; persist(); }
    openModal('<div class="big">' + stars(n) + "</div><h2 style='text-align:center'>Average happiness: " + avg + "%</h2><p style='text-align:center'>" +
      (best ? "🏆 New personal best!" : "Best: " + save.best.budget + "%") + "</p>" +
      '<div class="row" style="justify-content:center"><button class="btn" onclick="startBudget()">Try again</button><button class="btn alt" onclick="setMode(\'explore\')">Back to map</button></div>');
  }

  /* ---------- DIRECTORY ---------- */
  function showDirectory() {
    setMode("dir");
    openModal("<h2>📋 City Directory</h2><p class='help'>Every city service belongs to a team with a job to do. Tap one to see it on the map.</p>" +
      GROUPS.map(function (g) {
        return "<h3>" + g.emoji + " " + g.name + " <span class='help'>— " + g.blurb + "</span></h3><div class='grid'>" +
          g.ids.map(function (id) {
            return '<button class="btn alt" onclick="setMode(\'explore\');showCard(\'' + id + '\')">' + byId[id].emoji + "<br>" + byId[id].name + (save.visited[id] ? " ✓" : "") + "</button>";
          }).join("") + "</div>";
      }).join("") + '<div class="row"><button class="btn" onclick="setMode(\'explore\')">Back to map</button></div>');
  }

  /* ---------- HOW IT WORKS (family tree + tax loop) ---------- */
  function showTree() {
    setMode("tree");
    function node(n) {
      return '<span class="node ' + (n.id ? "link" : "") + '"' + (n.id ? ' onclick="setMode(\'explore\');showCard(\'' + n.id + '\')" title="Show on map"' : "") + ">" +
        (n.id ? byId[n.id].emoji + " " : "") + n.name + "<small>" + n.sub + "</small></span>";
    }
    function li(n, kids) { return "<li>" + node(n) + (kids ? "<ul>" + kids + "</ul>" : "") + "</li>"; }
    var groupsHtml = GROUPS.map(function (g) {
      return li({ name:g.emoji + " " + g.name, sub:g.blurb }, g.ids.map(function (id) {
        return li({ name:byId[id].dept, sub:byId[id].deptSub + " · " + byId[id].level, id:id });
      }).join(""));
    }).join("");
    openModal("<h2>🌳 How a City Works</h2>" +
      "<ul class='tree'>" + li(TREE.top,
        li({ name:"🗳️ Elected leaders", sub:"Chosen by residents in elections" },
          li({ name:"Mayor", sub:"Leads the city and makes sure laws are followed (the executive)", id:"hall" }) +
          li({ name:"City Council", sub:"Makes the rules and the budget (the legislature)", id:"hall" })) +
        li({ name:"🏢 City departments & other governments", sub:"Teams that do the daily work. Some belong to the county, state or nation." }, groupsHtml)) + "</ul>" +
      "<h3>The money loop</h3><div class='loop'><span class='b'>👨‍👩‍👧 People pay taxes</span>➜<span class='b'>🏛️ Council makes a budget</span>➜<span class='b'>🚒 Services get funded</span>➜<span class='b'>🏙️ Everyone benefits</span>➜<span class='b'>🗳️ Residents vote &amp; give feedback</span></div>" +
      "<p class='help'>Tap a yellow box to jump to that place on the map.</p>" +
      '<div class="row"><button class="btn" onclick="setMode(\'explore\')">Back to map</button></div>');
  }

  /* ---------- modal helpers ---------- */
  function openModal(html) { $("modal-box").innerHTML = html; $("modal").style.display = "flex"; }
  function closeModal() { $("modal").style.display = "none"; }
  $("modal").addEventListener("click", function (e) { if (e.target.id === "modal" && mode === "tree") setMode("explore"); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { if (mode === "explore") closeCard(); else setMode("explore"); } });
  </script>
</body>
</html>
