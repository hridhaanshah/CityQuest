<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>City Quest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --ink:#1b2438; --paper:#f7f9fc; --accent:#3fa7ff; --good:#1f9d55; --bad:#d64545; --warn:#e8a317; --muted:#5b6578; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI", system-ui, -apple-system, sans-serif; color:var(--ink); }
    #map { height:100vh; background:#20304a; }
    button { font-family:inherit; cursor:pointer; }

    /* top bar */
    #bar { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:1000; display:flex; gap:4px; align-items:center; flex-wrap:wrap; justify-content:center;
           background:rgba(247,249,252,.97); border:2px solid var(--ink); border-radius:14px; padding:6px 8px; box-shadow:0 4px 14px rgba(0,0,0,.35); max-width:97vw; }
    #bar button { border:none; background:transparent; border-radius:8px; font-size:14px; font-weight:600; padding:7px 10px; color:var(--ink); }
    #bar button:hover { background:#dbeafe; }
    #bar button.on { background:var(--ink); color:#fff; }
    #rank { font-size:13px; font-weight:600; padding:0 8px; border-left:2px solid #d3dae6; white-space:nowrap; }
    #rank small { display:block; font-weight:400; color:var(--muted); }

    /* pins */
    .pin { width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%; background:var(--c); border:3px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.6);
           display:flex; align-items:center; justify-content:center; font-size:17px; position:relative; transition:transform .15s; }
    .pin:hover { transform:scale(1.25); }
    .pin.visited::after { content:"✓"; position:absolute; right:-7px; top:-7px; background:var(--good); color:#fff; font-size:11px; font-weight:bold; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid #fff; }
    .quiz .pin.visited::after { display:none; }
    .quiz .leaflet-tooltip { display:none; }
    .leaflet-tooltip.lbl { font-weight:600; font-size:13px; border:2px solid var(--ink); border-radius:8px; background:var(--paper); color:var(--ink); }
    .ring { width:90px; height:90px; margin:-45px 0 0 -45px; border-radius:50%; border:5px solid #ffd43b; animation:pulse 1s ease-out infinite; pointer-events:none; }
    @keyframes pulse { from { transform:scale(.5); opacity:1; } to { transform:scale(1.5); opacity:0; } }
    .shake { animation:shake .35s; }
    @keyframes shake { 25% { transform:translateX(-8px);} 75% { transform:translateX(8px);} }

    /* info card */
    #card { position:fixed; z-index:1000; top:70px; left:10px; width:380px; max-height:calc(100vh - 90px); overflow:auto; background:var(--paper);
            border:2px solid var(--ink); border-radius:12px; padding:16px; box-shadow:0 6px 18px rgba(0,0,0,.4); display:none; }
    #card h2 { margin:0 0 6px; font-size:21px; }
    .tag { display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; background:var(--c,#555); color:#fff; margin:0 4px 6px 0; letter-spacing:.03em; }
    .tag.lvl { background:var(--ink); }
    #card h4 { margin:12px 0 3px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:#2f6db5; }
    #card p, #card li { margin:0; line-height:1.45; font-size:14px; }
    #card ul { margin:0; padding-left:18px; }
    .think { background:#fff6d6; border-left:4px solid var(--warn); padding:8px 10px; border-radius:6px; margin-top:12px; font-size:14px; }
    .share { height:8px; background:#dde4ef; border-radius:5px; overflow:hidden; margin-top:5px; }
    .share i { display:block; height:100%; background:var(--accent); }
    .row { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
    .btn { border:2px solid var(--ink); background:var(--accent); border-radius:8px; padding:8px 14px; font-size:14px; font-weight:700; color:#fff; }
    .btn:hover { filter:brightness(1.08); }
    .btn.alt { background:#fff; color:var(--ink); }
    .btn.good { background:#d9f5e3; color:var(--ink); } .btn.bad { background:#fddede; color:var(--ink); }
    .btn:disabled { opacity:.45; cursor:default; }
    .x { position:absolute; top:8px; right:10px; background:none; border:none; font-size:20px; color:var(--ink); }

    /* HUD */
    #hud { position:fixed; z-index:1000; bottom:14px; left:50%; transform:translateX(-50%); width:min(640px, 95vw); background:var(--paper); border:2px solid var(--ink);
           border-radius:12px; padding:14px 16px; box-shadow:0 6px 18px rgba(0,0,0,.45); display:none; max-height:60vh; overflow:auto; }
    #hud .top { display:flex; justify-content:space-between; font-weight:700; font-size:13px; color:#2f6db5; }
    #hud .q { font-size:17px; margin:8px 0; line-height:1.4; }
    #hud .fb { min-height:20px; font-size:14px; line-height:1.4; margin-top:6px; }
    .opts { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:6px; margin-top:6px; }
    .opts .btn { background:#fff; color:var(--ink); text-align:left; font-weight:600; }
    .opts .btn:hover { background:#e6f1ff; }
    .prog { height:6px; background:#dde4ef; border-radius:4px; overflow:hidden; margin-top:4px; }
    .prog i { display:block; height:100%; background:var(--good); transition:width .3s; }

    /* modal */
    #modal { position:fixed; inset:0; z-index:2000; background:rgba(10,16,30,.7); display:none; align-items:center; justify-content:center; padding:12px; }
    #modal .box { background:var(--paper); border:2px solid var(--ink); border-radius:14px; padding:22px; width:min(780px, 100%); max-height:94vh; overflow:auto; }
    #modal h2 { margin-top:0; } #modal h3 { margin:16px 0 6px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:8px; margin:10px 0; }
    .grid .btn { font-size:13px; padding:10px 8px; text-align:center; }
    .scen { font-size:18px; line-height:1.45; margin:10px 0; }
    .help { font-size:13px; color:var(--muted); }
    .big { font-size:42px; text-align:center; }
    .meters { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:6px 14px; margin:10px 0; }
    .meter .lbl { display:flex; justify-content:space-between; font-weight:600; font-size:13px; }
    .meter .bar { height:12px; background:#dde4ef; border-radius:8px; overflow:hidden; border:1px solid #b7c2d6; }
    .meter .bar i { display:block; height:100%; transition:width .4s; }
    .opt { display:block; width:100%; text-align:left; background:#fff; border:2px solid #b7c2d6; border-radius:10px; padding:10px 12px; margin:6px 0; font-size:14px; line-height:1.4; color:var(--ink); }
    .opt:hover:not(:disabled) { border-color:var(--accent); background:#eef6ff; }
    .opt.picked { border-color:var(--ink); background:#e6f1ff; }
    .effects span { display:inline-block; font-size:12px; font-weight:700; padding:2px 7px; border-radius:10px; margin:2px 3px 0 0; }
    .effects .up { background:#d9f5e3; color:#13663a; } .effects .down { background:#fddede; color:#8c2020; }
    table.lv { border-collapse:collapse; width:100%; font-size:13px; margin:6px 0; }
    table.lv th, table.lv td { border:1px solid #c7d0df; padding:6px 8px; text-align:left; vertical-align:top; }
    table.lv th { background:#e8eef8; }
    .order { counter-reset:o; }
    .order .opt::before { content:attr(data-n); display:inline-block; min-width:24px; font-weight:800; color:var(--accent); }
    .branch { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:8px; }
    .branch div { border:2px solid var(--ink); border-radius:10px; padding:10px; background:#fff; font-size:13px; line-height:1.4; }
    .branch b { display:block; font-size:15px; margin-bottom:3px; }
    .link { color:#2f6db5; font-weight:700; cursor:pointer; text-decoration:underline; }
    #toast { position:fixed; z-index:3000; top:76px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:9px 16px; border-radius:20px; font-weight:600; display:none; max-width:90vw; text-align:center; font-size:14px; }

    @media (max-width:640px) {
      #card { top:auto; bottom:0; left:0; right:0; width:auto; max-height:58vh; border-radius:14px 14px 0 0; }
      #bar button { padding:6px 7px; font-size:12px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="bar" role="toolbar" aria-label="Civic Explorer modes">
    <button id="m-explore" class="on" onclick="setMode('explore')">🗺️ Explore</button>
    <button id="m-quiz" onclick="startQuiz()">🎯 Challenge</button>
    <button id="m-dilemma" onclick="startDilemma()">🎩 Mayor's Desk</button>
    <button id="m-budget" onclick="startBudget()">💰 Budget Lab</button>
    <button id="m-law" onclick="startLaw()">📜 Make a Law</button>
    <button id="m-gov" onclick="showGov()">🏛️ Governments</button>
    <span id="rank"></span>
  </div>
  <button class="btn" style="position:fixed;bottom:16px;right:10px;z-index:1000" onclick="goHome()">🔄 Reset view</button>

  <div id="card" role="dialog" aria-live="polite"></div>
  <div id="hud"></div>
  <div id="modal"><div class="box" id="modal-box"></div></div>
  <div id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  /* =====================================================================
     DATA — positions are measured from the TOP-left of the 1920x1280 picture.
     Only places we can see in the picture have pins; edit `top` / `x` to nudge one.
     ===================================================================== */
  var W = 1920, H = 1280;
  function P(top, x) { return [H - top, x]; }

  var BUILDINGS = [
    { id:"hall", name:"City Hall", emoji:"🏛️", color:"#6b7280", top:300, x:1385, level:"City", dept:"Mayor's Office & City Council",
      what:"City Hall is where local laws (called ordinances) are made. The city council votes on rules and approves the budget, and the mayor leads the departments that carry them out.",

    { id:"library", name:"Public Library", emoji:"📚", color:"#6b4fa0", top:250, x:935, level:"City / County", dept:"Library System",

    { id:"voting", name:"Elections Center", emoji:"🗳️", color:"#2f6fb0", top:410, x:1000, level:"County & City", dept:"Elections Office",

    { id:"police", name:"Police Station", emoji:"🚓", color:"#3a5a98", top:270, x:410, level:"City", dept:"Police Department",

    { id:"hospital", name:"Public Hospital", emoji:"🏥", color:"#2a9d8f", top:920, x:420, level:"County & City", dept:"Public Health",

      jobs:["Teacher","Coach","Career counselor","Principal","Athletic director"],

  // places in the picture that are NOT government, used in "government or private?" questions

    { id:"shops", name:"Main Street Shops", emoji:"🏪", top:85, x:1350, fact:"Shops are private businesses. They pay taxes, and need permits from the city." },

  var byId = {}; BUILDINGS.concat(PRIVATE).forEach(function (b) { byId[b.id] = b; });

  var GROUPS = [
    { name:"Public Safety", ids:["police","fire"] }, { name:"Health", ids:["hospital"] }, { name:"Education & Learning", ids:["elementary","highschool","library"] },
    { name:"Parks & Recreation", ids:["parks","sports"] }, { name:"Infrastructure & Environment", ids:["publicworks","sanitation","transit"] },

  var LEVEL_ITEMS = [
    { t:"Collecting household garbage", a:"City", why:"Sanitation is a classic local service." },

      "<p class='help'>Set a tax rate, then split the money. Higher taxes raise more money but lower public trust. You can't spend more than you collect. (Amounts are in $ millions.)</p>" +
      '<div class="meter"><div class="lbl"><span>Tax rate</span><span id="rate-v"></span></div><input type="range" min="4" max="14" value="' + B.rate + '" style="width:100%" aria-label="tax rate" oninput="budgetRate(+this.value)"></div>' +
      rows + '<p><b id="left"></b></p>' +
      '<div class="row"><button class="btn" id="bg-go" onclick="budgetDone()">Approve budget ✅</button><button class="btn alt" onclick="setMode(\'explore\')">Exit</button></div>');
    budgetRefresh();
  }
  function bSpent() { return BUDGET_CATS.reduce(function (s, c) { return s + B.alloc[c.id]; }, 0); }
  function budgetRate(v) { B.rate = v; budgetCap(); budgetRefresh(); }
  function budgetCap() { var over = bSpent() - bRevenue(); BUDGET_CATS.forEach(function (c) { if (over > 0) { var t = Math.min(B.alloc[c.id], over); B.alloc[c.id] -= t; over -= t; } }); }
  function budgetSet(id, v) { var others = bSpent() - B.alloc[id]; B.alloc[id] = Math.min(v, bRevenue() - others); budgetRefresh(); }
  function budgetRefresh() {
    var need = bNeeds(), inputs = document.querySelectorAll("#modal-box input[type=range]");
    $("rate-v").textContent = B.rate + "%  →  $" + bRevenue() + "M collected  ·  trust " + (B.rate > 9 ? "↓" : "ok");
    BUDGET_CATS.forEach(function (c, i) {
      var pct = Math.min(1, B.alloc[c.id] / need[c.id]);
      $("v-" + c.id).textContent = "$" + B.alloc[c.id] + "M  (needs " + need[c.id] + ")";
      var bar = $("b-" + c.id); bar.style.width = pct * 100 + "%"; bar.style.background = pct >= 0.9 ? "var(--good)" : pct >= 0.6 ? "var(--warn)" : "var(--bad)";
      inputs[i + 1].value = B.alloc[c.id];
    });
    inputs[0].value = B.rate;
    var left = bRevenue() - bSpent(); $("left").textContent = "$" + left + "M left to spend" + (left > 0 ? " (unspent money goes to the reserve fund)" : "");
  }
  function budgetDone() {
    var need = bNeeds(), tot = 0, worst = null, wp = 2;
    BUDGET_CATS.forEach(function (c) { var p = Math.min(1, B.alloc[c.id] / need[c.id]); tot += p; if (p < wp) { wp = p; worst = c; } });
    var service = tot / BUDGET_CATS.length * 100, taxPenalty = Math.max(0, B.rate - 8) * 6, reserve = Math.max(0, bRevenue() - bSpent());
    var score = Math.round(Math.max(0, service - taxPenalty + Math.min(reserve, 10) * 0.5)); B.results.push(score);
    var last = B.year === 2;
    openModal("<h2>Year " + (B.year + 1) + " report</h2><div class='big'>" + (score >= 85 ? "😄" : score >= 65 ? "🙂" : "😟") + "</div>" +
      "<h2 style='text-align:center'>Public approval: " + score + "%</h2>" +
      "<p>Services met: <b>" + Math.round(service) + "%</b>" + (taxPenalty ? " · Tax backlash: <b>−" + taxPenalty + "</b>" : "") + (reserve ? " · Reserve saved: <b>$" + reserve + "M</b>" : "") + "</p>" +
      "<p>" + (wp < 1 ? "Biggest gap: <b>" + worst.name + "</b> received " + Math.round(wp * 100) + "% of what it needed." : "Every service got what it needed.") + "</p>" +
      "<p class='help'>Real budgets are public documents. Anyone can read one and speak at a budget hearing.</p>" +
      '<div class="row"><button class="btn" onclick="' + (last ? "budgetEnd()" : "B.year++;budgetYear()") + '">' + (last ? "Final results" : "Next year ➜") + "</button></div>");
  }
  function budgetEnd() {
    var avg = Math.round(B.results.reduce(function (a, b) { return a + b; }, 0) / B.results.length), n = avg >= 85 ? 3 : avg >= 68 ? 2 : 1, best = avg > save.best.budget;
    if (best) save.best.budget = avg; addXP(avg * 2);
    openModal('<div class="big">' + stars(n) + "</div><h2 style='text-align:center'>Average approval: " + avg + "%</h2><p style='text-align:center'>" + (best ? "🏆 New best! " : "Best: " + save.best.budget + "%. ") + "+" + avg * 2 + " XP</p>" +
      '<div class="row" style="justify-content:center"><button class="btn" onclick="startBudget()">Try again</button><button class="btn alt" onclick="setMode(\'explore\')">Back to map</button></div>');
  }

  /* ---------- MAKE A LAW ---------- */
  var LW = null;
  function startLaw() {
    setMode("law");
    LW = { order:shuffle(LAW_STEPS.map(function (_, i) { return i; })), picked:[], wrong:0, checked:false };
    lawRender();
  }
  function lawRender() {
    var list = LW.order.map(function (si, i) {
      var pos = LW.picked.indexOf(si);
      return '<button class="opt ' + (pos >= 0 ? "picked" : "") + '" data-n="' + (pos >= 0 ? pos + 1 : "•") + '" ' + (LW.checked ? "disabled" : "") + ' onclick="lawPick(' + si + ')">' + LAW_STEPS[si].t + "</button>";
    }).join("");
    var result = "";
    if (LW.checked) {
      var ok = LW.picked.every(function (v, i) { return v === i; });
      result = ok ? "<p style='color:var(--good);font-weight:700'>✅ Perfect order!</p>" : "<p style='color:var(--bad);font-weight:700'>Not quite. Here's the real order:</p>";
      result += "<ol>" + LAW_STEPS.map(function (s) { return "<li><b>" + s.t + "</b><br><span class='help'>" + s.why + "</span></li>"; }).join("") + "</ol>";
    }
    openModal("<h2>📜 How a Local Law Becomes Real</h2><p class='help'>Tap the steps in the order they happen, from first to last. Tap again to undo your last pick.</p>" +
      '<div class="order">' + list + "</div>" + result +
      '<div class="row">' + (LW.checked ? '<button class="btn" onclick="startLaw()">Try again</button>' : '<button class="btn" ' + (LW.picked.length < LAW_STEPS.length ? "disabled" : "") + ' onclick="lawCheck()">Check my order</button>') +
      '<button class="btn alt" onclick="setMode(\'explore\')">Exit</button></div>');
  }
  function lawPick(si) {
    var p = LW.picked.indexOf(si);
    if (p >= 0) { if (p === LW.picked.length - 1) LW.picked.pop(); } else LW.picked.push(si);
    lawRender();
  }
  function lawCheck() {
    LW.checked = true; var right = LW.picked.filter(function (v, i) { return v === i; }).length;
    var sc = Math.round(right / LAW_STEPS.length * 100); if (sc > save.best.law) save.best.law = sc; addXP(sc);
    lawRender(); toast(right + "/" + LAW_STEPS.length + " steps in the right place · +" + sc + " XP");
  }

  /* ---------- GOVERNMENTS ---------- */
  function showGov() {
    setMode("gov");
    var rows = [
      ["City / Town", "Mayor & city council", "Police, fire, parks, local roads, trash, zoning, permits"],
      ["County", "County board / commissioners; sheriff; courts", "Courts, elections, public health, jails, property records"],
      ["State", "Governor & state legislature", "Driver's licenses, state highways, public universities, education standards"],
      ["Federal (national)", "President, Congress, Supreme Court", "Postal Service, national defense, passports, Social Security, money"]
    ];
    openModal("<h2>🏛️ Levels & Branches of Government</h2>" +
      "<table class='lv'><tr><th>Level</th><th>Led by</th><th>Examples of what it does</th></tr>" + rows.map(function (r) { return "<tr><td><b>" + r[0] + "</b></td><td>" + r[1] + "</td><td>" + r[2] + "</td></tr>"; }).join("") + "</table>" +
      "<h3>The three branches (at every level)</h3><div class='branch'>" +
      "<div><b>Legislative: makes the laws</b>City council · State legislature · Congress<br><span class='link' onclick=\"setMode('explore');showCard('hall')\">🏛️ See City Hall</span></div>" +
      "<div><b>Executive: carries them out</b>Mayor · Governor · President<br><span class='link' onclick=\"setMode('explore');showCard('police')\">🚓 See the police</span></div>" +
      "<div><b>Judicial: interprets them</b>Local, state & federal courts<br><span class='link' onclick=\"setMode('explore');showCard('courthouse')\">⚖️ See the courthouse</span></div></div>" +
      "<h3>Who's who in this city</h3>" + GROUPS.map(function (g) {
        return "<p style='margin:4px 0'><b>" + g.name + ":</b> " + g.ids.map(function (id) { return "<span class='link' onclick=\"setMode('explore');showCard('" + id + "')\">" + byId[id].emoji + " " + byId[id].name + "</span>"; }).join(" · ") + "</p>";
      }).join("") +
      "<h3>The money loop</h3><p>Residents and businesses pay taxes and fees → the council sets a budget → departments deliver services → residents vote and give feedback → leaders adjust.</p>" +
      '<div class="row"><button class="btn" onclick="setMode(\'explore\')">Back to map</button></div>');
  }

  /* ---------- modal helpers ---------- */
  function openModal(html) { $("modal-box").innerHTML = html; $("modal").style.display = "flex"; }
  function closeModal() { $("modal").style.display = "none"; }
  $("modal").addEventListener("click", function (e) { if (e.target.id === "modal" && mode === "gov") setMode("explore"); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { if (mode === "explore") closeCard(); else setMode("explore"); } });
  </script>
</body>
</html>
